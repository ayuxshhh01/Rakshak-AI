services:
  - type: web
    name: tourist-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.production
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        value: "change-me-in-render"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: REDIS_URL
        value: redis://redis:6379/0
      - key: GOOGLE_MAPS_API_KEY
        value: ""
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""

  - type: redis
    name: tourist-redis
    plan: free
    ipAllowList: []
