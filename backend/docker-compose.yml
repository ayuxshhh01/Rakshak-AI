services:

  redis:
    image: redis:alpine
    restart: always

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://user:password@postgres:5432/tourist_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A backend worker -l info --pool=solo
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://user:password@postgres:5432/tourist_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  ai_service:
    build: ./ai_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./ai_service:/app
    ports:
      - "8001:8001"
    restart: always